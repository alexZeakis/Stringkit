<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141816"></head><body>
<title>Stringkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone tool, sticky instrument + tab bar, tuner gauge or chord grid below */
:root{
  --bg:#EDF0EB; --surface:#F8FAF6; --fg:#1C2320; --muted:#5F6B64; --line:#C7CFC8;
  --accent:#A86F12; --good:#2A8552; --warn:#BF4E2A;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1D2320; --fg:#E7ECE6; --muted:#93A098; --line:#2F3833;
  --accent:#DDA742; --good:#4CC27E; --warn:#E7774F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1D2320; --fg:#E7ECE6; --muted:#93A098; --line:#2F3833;
  --accent:#DDA742; --good:#4CC27E; --warn:#E7774F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0}
h1 span{color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs a{font:600 15px var(--body);color:var(--muted);text-decoration:none;padding:6px 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--fg);border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Tuner */
.gauge{width:100%;max-width:420px;display:block;margin:18px auto 0}
.gauge .tick{stroke:var(--line);stroke-width:1.5}
.gauge .tick.major{stroke:var(--muted);stroke-width:2}
.gauge .lbl{fill:var(--muted);font:500 10px var(--mono);text-anchor:middle}
.gauge .zone{fill:none;stroke:var(--good);stroke-width:8;opacity:.35}
#needle{transition:transform .12s linear;transform-origin:150px 160px}
#needle line{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
#needle circle{fill:var(--accent)}
.tuner.intune #needle line{stroke:var(--good)}
.tuner.intune #needle circle{fill:var(--good)}
.tuner.idle #needle{opacity:.35}
.readout{text-align:center;margin-top:4px}
.note{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.03em}
.note sub{font-size:28px;color:var(--muted);vertical-align:baseline;margin-left:2px}
.tuner.intune .note{color:var(--good)}
.hint{font:500 15px var(--body);color:var(--muted);min-height:22px;margin-top:6px}
.hint.up,.hint.down{color:var(--warn)}
.tuner.intune .hint{color:var(--good)}
.meta{font:400 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;min-height:18px}
.strings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.strings button{min-width:52px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 6px;font:500 15px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.strings button small{font:400 10px var(--body);color:var(--muted)}
.strings button.near{border-color:var(--accent)}
.strings button.locked{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.strings button.locked small{color:var(--bg);opacity:.7}
.modeline{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
.start{display:block;margin:22px auto 0;border:0;background:var(--accent);color:#fff;font:600 16px var(--body);padding:12px 28px;border-radius:999px;cursor:pointer}
.start.stop{background:transparent;color:var(--fg);border:1px solid var(--line)}
.err{margin:16px auto 0;max-width:420px;font-size:14px;color:var(--warn);text-align:center}

/* Chords */
.picker{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.label{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;font:500 14px var(--mono);cursor:pointer;min-width:42px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chordhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.chordname{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1}
.tones{display:flex;gap:10px;font:500 14px var(--mono)}
.tones span{display:flex;flex-direction:column;align-items:center}
.tones small{font:400 10px var(--body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card svg{width:100%;max-width:170px;height:auto}
.card .tab{font:500 14px var(--mono);letter-spacing:.04em}
.card .pos{font-size:11px;color:var(--muted)}
.d-str,.d-fret{stroke:var(--muted);stroke-width:1.2}
.d-nut{stroke:var(--fg);stroke-width:5}
.d-dot{fill:var(--fg)}
.d-root{fill:var(--accent)}
.d-open{fill:none;stroke:var(--fg);stroke-width:1.5}
.d-open.d-rootopen{stroke:var(--accent);stroke-width:2}
.d-x{stroke:var(--muted);stroke-width:1.6}
.d-t{fill:var(--muted);font:400 9px var(--mono);text-anchor:middle}
.d-fr{fill:var(--muted);font:500 10px var(--mono);text-anchor:end}
.empty{color:var(--muted);margin-top:16px}
.legend{font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){#needle{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>String<span>kit</span></h1>
      <div class="seg" role="group" aria-label="Instrument">
        <button id="i-guitar" aria-pressed="true">Guitar</button>
        <button id="i-mandolin" aria-pressed="false">Mandolin</button>
      </div>
    </div>
    <nav class="tabs">
      <a href="#tuner" id="t-tuner" class="on">Tuner</a>
      <a href="#chords" id="t-chords">Chords</a>
    </nav>
  </header>

  <section id="v-tuner" class="tuner idle">
    <svg class="gauge" viewBox="0 0 300 175" aria-hidden="true">
      <g id="ticks"></g>
      <g id="needle"><line x1="150" y1="160" x2="150" y2="38"/><circle cx="150" cy="160" r="7"/></g>
    </svg>
    <div class="readout">
      <div class="note" id="note">E<sub>2</sub></div>
      <div class="hint" id="hint">Tap Start and play a string</div>
      <div class="meta" id="meta">&nbsp;</div>
    </div>
    <div class="strings" id="strings"></div>
    <div class="modeline" id="modeline">Auto: picks the closest string. Tap a string to lock it.</div>
    <button class="start" id="start">Start tuner</button>
    <p class="err" id="err" hidden></p>
  </section>

  <section id="v-chords" hidden>
    <div class="picker">
      <div class="label">Root</div>
      <div class="chips" id="roots"></div>
      <div class="label">Type</div>
      <div class="chips" id="types"></div>
    </div>
    <div class="chordhead">
      <div class="chordname" id="cname">A</div>
      <div class="tones" id="ctones"></div>
    </div>
    <div class="grid" id="cgrid"></div>
    <p class="legend"><i></i>root note &nbsp;·&nbsp; tab reads low string to high, x = muted, 0 = open</p>
  </section>
</div>

<script>
(function(){
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const INSTR={
  guitar:{tuning:[40,45,50,55,59,64],span:3,mute:true,minSound:4,sp:22},
  mandolin:{tuning:[55,62,69,76],span:4,mute:false,minSound:4,sp:30}
};
const ROOTS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const TYPES=[['','maj'],['m','m'],['7','7'],['maj7','maj7'],['m7','m7'],['sus2','sus2'],['sus4','sus4'],['7sus4','7sus4'],
  ['6','6'],['m6','m6'],['add9','add9'],['9','9'],['dim','dim'],['dim7','dim7'],['m7b5','m7b5'],['aug','aug']];
const FORM={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],sus2:[0,2,7],sus4:[0,5,7],'7sus4':[0,5,7,10],
  '6':[0,4,7,9],m6:[0,3,7,9],add9:[0,4,7,2],'9':[0,4,7,10,2],dim:[0,3,6],dim7:[0,3,6,9],m7b5:[0,3,6,10],aug:[0,4,8]};
const IVL={0:'R',2:'9',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'#5',9:'6',10:'b7',11:'7'};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const $=id=>document.getElementById(id);
let inst=store('sk-inst')==='mandolin'?'mandolin':'guitar';
let root=store('sk-root')||'A', ctype=store('sk-type')??'';
if(!ROOTS.includes(root))root='A'; if(!(ctype in FORM))ctype='';
const midiName=m=>SHARP[m%12]+(Math.floor(m/12)-1);
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ---------- view routing ---------- */
function route(){
  const v=location.hash==='#chords'?'chords':'tuner';
  $('v-tuner').hidden=v!=='tuner'; $('v-chords').hidden=v!=='chords';
  $('t-tuner').classList.toggle('on',v==='tuner'); $('t-chords').classList.toggle('on',v==='chords');
}
addEventListener('hashchange',route); route();

function setInst(n){
  inst=n; store('sk-inst',n);
  $('i-guitar').setAttribute('aria-pressed',n==='guitar'); $('i-mandolin').setAttribute('aria-pressed',n==='mandolin');
  locked=-1; buildStrings(); renderChords();
}
$('i-guitar').onclick=()=>setInst('guitar'); $('i-mandolin').onclick=()=>setInst('mandolin');

/* ---------- tuner ---------- */
const CX=150,CY=160,R=128,MAXA=70;
(function ticks(){
  let s='';
  const a2xy=(deg,r)=>{const t=(deg-90)*Math.PI/180;return[CX+r*Math.cos(t),CY+r*Math.sin(t)]};
  const z1=a2xy(-5*MAXA/50,R+8),z2=a2xy(5*MAXA/50,R+8);
  s+=`<path class="zone" d="M${z1[0]} ${z1[1]} A${R+8} ${R+8} 0 0 1 ${z2[0]} ${z2[1]}"/>`;
  for(let c=-50;c<=50;c+=5){
    const deg=c*MAXA/50,major=c%25===0;
    const [x1,y1]=a2xy(deg,R-(major?14:8)),[x2,y2]=a2xy(deg,R);
    s+=`<line class="tick${major?' major':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if(major){const [lx,ly]=a2xy(deg,R+20);s+=`<text class="lbl" x="${lx}" y="${ly+3}">${c>0?'+'+c:c}</text>`}
  }
  $('ticks').innerHTML=s;
})();

let locked=-1;
function buildStrings(){
  const t=INSTR[inst].tuning;
  $('strings').innerHTML=t.map((m,i)=>`<button data-i="${i}"><span>${SHARP[m%12]}</span><small>${midiName(m)}</small></button>`).join('');
  $('strings').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; locked=locked===i?-1:i; markStrings(-1);
    $('modeline').textContent=locked<0?'Auto: picks the closest string. Tap a string to lock it.':'Locked to '+midiName(t[locked])+'. Tap it again for auto.';
    if(locked>=0)showTarget(t[locked]);
  });
  markStrings(-1); showTarget(t[locked<0?0:locked]);
}
function markStrings(near){
  $('strings').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('locked',i===locked);b.classList.toggle('near',i===near&&locked<0)});
}
function showTarget(m){const n=midiName(m);$('note').innerHTML=n.replace(/(-?\d+)$/,'<sub>$1</sub>')}

let ctx=null,stream=null,analyser=null,buf=null,raf=0,hist=[],smooth=0,lastSeen=0,wake=null,frame=0;
async function start(){
  $('err').hidden=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomedia');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent='The microphone is blocked here. The Claude viewer does not give pages mic access, so open the standalone Stringkit file in Chrome and allow the microphone.';
    $('err').hidden=false; return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  $('start').textContent='Stop'; $('start').classList.add('stop');
  $('hint').textContent='Listening…';
  loop();
}
function stop(){
  cancelAnimationFrame(raf);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(ctx)ctx.close(); ctx=stream=null;
  try{wake&&wake.release()}catch(e){} wake=null;
  $('start').textContent='Start tuner'; $('start').classList.remove('stop');
  $('v-tuner').className='tuner idle'; setNeedle(0);
  $('hint').className='hint'; $('hint').textContent='Tap Start and play a string'; $('meta').innerHTML='&nbsp;';
}
$('start').onclick=()=>ctx?stop():start();

/* McLeod pitch method (normalized square difference) */
function detect(x,sr){
  const N=x.length; let rms=0; for(let i=0;i<N;i++)rms+=x[i]*x[i];
  rms=Math.sqrt(rms/N); if(rms<0.008)return -1;
  const minLag=Math.floor(sr/1400),maxLag=Math.min(Math.floor(sr/60),N>>1);
  const n=new Float32Array(maxLag+2);
  for(let t=0;t<=maxLag+1;t++){
    let ac=0,m=0; for(let j=0;j<N-t;j++){ac+=x[j]*x[j+t];m+=x[j]*x[j]+x[j+t]*x[j+t]}
    n[t]=m>0?2*ac/m:0;
  }
  const peaks=[]; let t=1;
  while(t<maxLag&&n[t]>0)t++;
  while(t<maxLag){
    while(t<maxLag&&n[t]<=0)t++;
    let best=-1,bi=-1;
    while(t<maxLag&&n[t]>0){if(n[t]>best){best=n[t];bi=t}t++}
    if(bi>0&&bi>=minLag)peaks.push(bi);
  }
  if(!peaks.length)return -1;
  let hi=0; for(const p of peaks)hi=Math.max(hi,n[p]);
  if(hi<0.5)return -1;
  const th=0.88*hi; const p=peaks.find(q=>n[q]>=th);
  const a=n[p-1],b=n[p],c=n[p+1],d=a-2*b+c;
  const shift=d?0.5*(a-c)/d:0;
  return sr/(p+shift);
}
function setNeedle(c){$('needle').style.transform=`rotate(${Math.max(-50,Math.min(50,c))*MAXA/50}deg)`}
function loop(){
  raf=requestAnimationFrame(loop);
  if(++frame%2)return;
  analyser.getFloatTimeDomainData(buf);
  const f=detect(buf,ctx.sampleRate), now=performance.now(), el=$('v-tuner');
  if(f>0){
    hist.push(f); if(hist.length>5)hist.shift();
    const med=[...hist].sort((a,b)=>a-b)[hist.length>>1];
    const t=INSTR[inst].tuning;
    let idx=locked;
    if(idx<0){let bd=1e9;t.forEach((m,i)=>{const d=Math.abs(1200*Math.log2(med/mtof(m)));if(d<bd){bd=d;idx=i}})}
    const target=t[idx], cents=1200*Math.log2(med/mtof(target));
    smooth=lastSeen&&now-lastSeen<400?smooth*0.6+cents*0.4:cents; lastSeen=now;
    showTarget(target); markStrings(idx); setNeedle(smooth);
    const played=Math.round(69+12*Math.log2(med/440));
    $('meta').textContent=`${med.toFixed(1)} Hz · ${smooth>=0?'+':''}${smooth.toFixed(0)} ¢ · hearing ${midiName(played)}`;
    const h=$('hint'), ok=Math.abs(smooth)<5;
    el.className='tuner'+(ok?' intune':'');
    if(ok){h.className='hint';h.textContent='In tune'}
    else if(smooth<0){h.className='hint up';h.textContent=smooth<-50?'Much too low, tune up':'Flat, tune up'}
    else{h.className='hint down';h.textContent=smooth>50?'Much too high, tune down':'Sharp, tune down'}
  }else{
    hist=[];
    if(lastSeen&&now-lastSeen>1500){el.className='tuner idle';$('hint').className='hint';$('hint').textContent='Listening…';lastSeen=0}
  }
}

/* ---------- chords ---------- */
function useFlats(r){return r.includes('b')||r==='F'}
function voicings(rootPc,ivs,I){
  const n=I.tuning.length, set=new Set(ivs.map(i=>(rootPc+i)%12));
  const fifth=(rootPc+7)%12, optFifth=ivs.length>=4&&ivs.includes(7);
  const required=ivs.map(i=>(rootPc+i)%12).filter(p=>!(optFifth&&p===fifth));
  const out=new Map(), cur=new Array(n);
  function evaluate(fr){
    const key=fr.join(','); if(out.has(key))return;
    const notes=fr.map((f,i)=>f<0?null:I.tuning[i]+f);
    const snd=notes.filter(x=>x!==null); if(snd.length<I.minSound)return;
    const pcs=new Set(snd.map(m=>m%12));
    if(!required.every(p=>pcs.has(p)))return;
    const bassPc=snd[0]%12;
    if(I.mute&&bassPc!==rootPc)return;
    const fretted=fr.filter(f=>f>0);
    const minF=fretted.length?Math.min(...fretted):0, maxF=fretted.length?Math.max(...fretted):0;
    if(maxF-minF>I.span)return;
    let fingers=fretted.length, barre=false;
    if(fingers>4){
      const first=fr.indexOf(minF);
      for(let i=first;i<n;i++)if(fr[i]<=0)return;
      fingers=1+fr.filter(f=>f>minF).length; barre=true;
      if(fingers>4)return;
    }
    const mutes=fr.filter(f=>f<0).length, opens=fr.filter(f=>f===0).length;
    let s=minF*0.35+fingers*0.5+(barre?0.8:0)+mutes*0.6-opens*0.25+(maxF-minF)*0.45;
    if(optFifth&&!pcs.has(fifth))s+=0.4;
    if(!I.mute&&bassPc!==rootPc)s+=1.2;
    if(opens&&maxF>=5)s+=1+0.3*(maxF-5);
    out.set(key,{fr:fr.slice(),score:s,barre,minF,maxF});
  }
  for(let w=1;w<=12;w++){
    (function rec(s){
      if(s===n){evaluate(cur);return}
      const opts=I.mute?[-1,0]:[0]; for(let f=w;f<=w+I.span;f++)opts.push(f);
      for(const f of opts){
        if(f===-1&&s>0&&cur[s-1]!==-1)continue;
        if(f===-1&&s>=n-I.minSound)continue;
        if(f>=0&&!set.has((I.tuning[s]+f)%12))continue;
        cur[s]=f; rec(s+1);
      }
    })(0);
  }
  const all=[...out.values()].sort((a,b)=>a.score-b.score), pick=[], per={};
  for(const v of all){
    const b=Math.floor(v.minF/3); if((per[b]||0)>=2)continue;
    per[b]=(per[b]||0)+1; pick.push(v); if(pick.length>=8)break;
  }
  return pick;
}
function diagram(v,I,rootPc,names){
  const n=I.tuning.length, sp=I.sp, fh=24, FR=5, L=26, T=26;
  const base=v.maxF<=FR?1:v.minF;
  const W=L+sp*(n-1)+18, H=T+fh*FR+20;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chord diagram">`;
  for(let i=0;i<=FR;i++){const y=T+i*fh;s+=`<line class="${i===0&&base===1?'d-nut':'d-fret'}" x1="${L}" y1="${y}" x2="${L+sp*(n-1)}" y2="${y}"/>`}
  for(let i=0;i<n;i++){const x=L+i*sp;s+=`<line class="d-str" x1="${x}" y1="${T}" x2="${x}" y2="${T+fh*FR}"/>`}
  if(base>1)s+=`<text class="d-fr" x="${L-7}" y="${T+fh*0.5+4}">${base}fr</text>`;
  if(v.barre){
    const first=v.fr.indexOf(v.minF), y=T+(v.minF-base+0.5)*fh;
    s+=`<rect class="d-dot" x="${L+first*sp-7}" y="${y-7}" width="${sp*(n-1-first)+14}" height="14" rx="7"/>`;
  }
  v.fr.forEach((f,i)=>{
    const x=L+i*sp, isRoot=f>=0&&(I.tuning[i]+f)%12===rootPc;
    if(f<0){s+=`<path class="d-x" d="M${x-4} ${T-15}l8 8m0 -8l-8 8"/>`}
    else if(f===0){s+=`<circle class="d-open${isRoot?' d-rootopen':''}" cx="${x}" cy="${T-11}" r="4.5"/>`}
    else{const y=T+(f-base+0.5)*fh;s+=`<circle class="${isRoot?'d-root':'d-dot'}" cx="${x}" cy="${y}" r="7.5"/>`}
    if(f>=0)s+=`<text class="d-t" x="${x}" y="${H-4}">${names[(I.tuning[i]+f)%12]}</text>`;
  });
  return s+'</svg>';
}
function renderChords(){
  const I=INSTR[inst], rootPc=SHARP.indexOf(root)>=0?SHARP.indexOf(root):FLAT.indexOf(root);
  const names=useFlats(root)?FLAT:SHARP, ivs=FORM[ctype];
  $('roots').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===root));
  $('types').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===ctype));
  $('cname').textContent=root+ctype;
  $('ctones').innerHTML=ivs.map(i=>`<span>${names[(rootPc+i)%12]}<small>${IVL[i]}</small></span>`).join('');
  const vs=voicings(rootPc,ivs,I);
  if(!vs.length){$('cgrid').innerHTML='<p class="empty">No playable shape found in the first 12 frets.</p>';return}
  $('cgrid').innerHTML=vs.map(v=>{
    const tab=v.fr.some(f=>f>=10)?v.fr.map(f=>f<0?'x':f).join(' '):v.fr.map(f=>f<0?'x':f).join('');
    const pos=v.minF===0||v.maxF<=4?'Open position':'Fret '+v.minF+(v.barre?', barre':'');
    return `<div class="card">${diagram(v,I,rootPc,names)}<div class="tab">${tab}</div><div class="pos">${pos}</div></div>`;
  }).join('');
}
$('roots').innerHTML=ROOTS.map(r=>`<button data-r="${r}">${r}</button>`).join('');
$('types').innerHTML=TYPES.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
$('roots').onclick=e=>{const b=e.target.closest('button');if(!b)return;root=b.dataset.r;store('sk-root',root);renderChords()};
$('types').onclick=e=>{const b=e.target.closest('button');if(!b)return;ctype=b.dataset.t;store('sk-type',ctype);renderChords()};

setInst(inst);
})();
</script>
